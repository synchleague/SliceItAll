# Slice it All printer and material catalog
# Edit the installed copy from Help > Edit Printer & Material Catalog.
# source = user marks a preset as the user's. A newer catalog keeps those presets.
# A file with a [catalog] section refreshes shared presets. A file without one adds presets.
#
# Materials are available on every printer of the same kind.
# optimized_for lists printer model ids, or printer preset names, the profile was tuned for.
# Leave it empty for a general profile.
#
# inherits names a profile that is already installed.
# Any other key is a print setting, for example temperature or exposure_time.

[catalog]
version = 1

# [material:My PLA]
# technology = FFF
# inherits = Generic PLA
# optimized_for = KOBRAS1, ENDER3
# temperature = 210
# first_layer_temperature = 215
# bed_temperature = 60
# filament_type = PLA

# [material:My Resin]
# technology = SLA
# inherits = Generic Resin
# optimized_for = MARS4MAX
# exposure_time = 2.5

# [printer:My Printer]
# technology = FFF
# inherits = Ender-3
# printer_model = MYPRINTER
