name = FlashForge Focus 13.3
variants = default
technology = SLA
family = FOTO
default_materials = Standard @FLASHFORGE; ABS-like @FLASHFORGE; Water-washable @FLASHFORGE; Plant-based @FLASHFORGE; Tough @FLASHFORGE; Flexible @FLASHFORGE; High temperature @FLASHFORGE; Clear @FLASHFORGE

