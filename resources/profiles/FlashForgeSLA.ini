# FlashForge SLA printers.
# Bed size and pixel count follow the public UVtools machine list.
# Exposure times are starting points for 0.05 mm on a mono LCD, not a tuned resin sheet.
# Printers marked EXPORT_GOO write a .goo file. Other machines write .sl1 until their own file type is added.

[vendor]
name = FlashForge SLA
config_version = 1.1.0

[printer_model:FLASHFORGE_EXPLORER_MAX]
name = FlashForge Explorer MAX
variants = default
technology = SLA
family = FOTO
default_materials = Standard @FLASHFORGE; ABS-like @FLASHFORGE; Water-washable @FLASHFORGE; Plant-based @FLASHFORGE; Tough @FLASHFORGE; Flexible @FLASHFORGE; High temperature @FLASHFORGE; Clear @FLASHFORGE

