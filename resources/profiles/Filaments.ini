# Retail filament brands for any FDM printer.
# Temperatures are starting points for 1.75 mm filament, not a tuned flow profile.

[vendor]
name = Filaments
config_version = 1.0.0
templates_profile = 1

[filament:*common*]
filament_diameter = 1.75
extrusion_multiplier = 1
filament_cost = 0
compatible_printers_condition = printer_technology=="FFF"

[filament:*pla*]
inherits = *common*
filament_type = PLA
filament_density = 1.24
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
cooling = 1
fan_always_on = 1
fan_below_layer_time = 100
max_fan_speed = 100
min_fan_speed = 100
disable_fan_first_layers = 1

[filament:*pla_plus*]
inherits = *pla*
temperature = 215
first_layer_temperature = 220
disable_fan_first_layers = 2

[filament:*petg*]
inherits = *common*
filament_type = PETG
filament_density = 1.27
temperature = 240
first_layer_temperature = 245
bed_temperature = 70
first_layer_bed_temperature = 70
cooling = 1
fan_always_on = 1
fan_below_layer_time = 20
max_fan_speed = 50
min_fan_speed = 20
disable_fan_first_layers = 3

[filament:*abs*]
inherits = *common*
filament_type = ABS
filament_density = 1.04
temperature = 250
first_layer_temperature = 255
bed_temperature = 100
first_layer_bed_temperature = 100
cooling = 0
fan_always_on = 0
fan_below_layer_time = 20
max_fan_speed = 30
min_fan_speed = 0
disable_fan_first_layers = 3

[filament:*asa*]
inherits = *abs*
filament_type = ASA
filament_density = 1.07
temperature = 260
first_layer_temperature = 260

[filament:*tpu*]
inherits = *common*
filament_type = TPU
filament_density = 1.21
extrusion_multiplier = 1.05
temperature = 225
first_layer_temperature = 230
bed_temperature = 50
first_layer_bed_temperature = 50
cooling = 1
fan_always_on = 1
fan_below_layer_time = 20
max_fan_speed = 80
min_fan_speed = 40
disable_fan_first_layers = 3

