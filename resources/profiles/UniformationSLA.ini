# Uniformation SLA printers.
# Bed size and pixel count follow the public UVtools machine list.
# Exposure times are starting points for 0.05 mm on a mono LCD, not a tuned resin sheet.
# Printers marked EXPORT_GOO write a .goo file. Other machines write .sl1 until their own file type is added.

[vendor]
name = Uniformation SLA
config_version = 1.1.0

[printer_model:UNIFORMATION_GKONE]
name = UniFormation GKone
variants = default
technology = SLA
family = GK
default_materials = Standard @UNIFORMATION; ABS-like @UNIFORMATION; Water-washable @UNIFORMATION; Plant-based @UNIFORMATION; Tough @UNIFORMATION; Flexible @UNIFORMATION; High temperature @UNIFORMATION; Clear @UNIFORMATION

[printer_model:UNIFORMATION_GKTWO]
name = UniFormation GKtwo
variants = default
technology = SLA
family = GK
default_materials = Standard @UNIFORMATION; ABS-like @UNIFORMATION; Water-washable @UNIFORMATION; Plant-based @UNIFORMATION; Tough @UNIFORMATION; Flexible @UNIFORMATION; High temperature @UNIFORMATION; Clear @UNIFORMATION

[sla_print:*common UNIFORMATION print*]
compatible_printers_condition = printer_notes=~/.*VENDOR_UNIFORMATION.*/
bottom_layers = 5
faded_layers = 6
slice_closing_radius = 0.005
supports_enable = 1
support_tree_type = default
support_object_elevation = 5
support_head_front_diameter = 0.4
support_head_penetration = 0.4
support_head_width = 3
support_pillar_diameter = 1
support_pillar_connection_mode = zigzag
support_pillar_widening_factor = 0
support_small_pillar_diameter_percent = 60%
support_base_diameter = 3
support_base_height = 1
support_critical_angle = 45
support_max_bridge_length = 10
pad_enable = 1
pad_wall_thickness = 1
pad_wall_height = 0
pad_wall_slope = 45
pad_brim_size = 1.6
pad_max_merge_distance = 50

[sla_print:0.025 Detail @UNIFORMATION]
inherits = *common UNIFORMATION print*
compatible_printers_condition = printer_notes=~/.*EXPORT_SL1.*/
layer_height = 0.025
output_filename_format = [input_filename_base].sl1

[sla_print:0.05 Normal @UNIFORMATION]
inherits = *common UNIFORMATION print*
compatible_printers_condition = printer_notes=~/.*EXPORT_SL1.*/
layer_height = 0.05
output_filename_format = [input_filename_base].sl1

[sla_print:0.10 Draft @UNIFORMATION]
inherits = *common UNIFORMATION print*
compatible_printers_condition = printer_notes=~/.*EXPORT_SL1.*/
layer_height = 0.10
output_filename_format = [input_filename_base].sl1

[sla_material:*common UNIFORMATION resin*]
compatible_printers_condition = printer_notes=~/.*VENDOR_UNIFORMATION.*/
material_vendor = Uniformation
initial_layer_height = 0.05
exposure_pwm = 255
initial_exposure_pwm = 255
area_fill = 50
material_correction = 1,1,1
sla_initial_primary_lift_distance = 5
sla_initial_primary_lift_speed = 60
sla_initial_secondary_lift_distance = 0
sla_initial_secondary_lift_speed = 60
sla_initial_primary_retract_distance = 5
sla_initial_primary_retract_speed = 150
sla_initial_secondary_retract_distance = 0
sla_initial_secondary_retract_speed = 150
sla_initial_wait_before_lift = 0
sla_initial_wait_after_lift = 0
sla_initial_wait_after_retract = 0.5
sla_primary_lift_distance = 5
sla_primary_lift_speed = 80
sla_secondary_lift_distance = 0
sla_secondary_lift_speed = 80
sla_primary_retract_distance = 5
sla_primary_retract_speed = 150
sla_secondary_retract_distance = 0
sla_secondary_retract_speed = 150
sla_wait_before_lift = 0
sla_wait_after_lift = 0
sla_wait_after_retract = 0.5
material_notes = Starting exposure for 0.05 mm on a mono LCD. Calibrate on this printer before a real part.\nDistances are mm. Speeds are mm/min. Waits are seconds.

[sla_material:Standard @UNIFORMATION]
inherits = *common UNIFORMATION resin*
material_type = Tough
material_colour = #808080
exposure_time = 2.5
initial_exposure_time = 35

[sla_material:ABS-like @UNIFORMATION]
inherits = *common UNIFORMATION resin*
material_type = Tough
material_colour = #3a3a3a
exposure_time = 2.8
initial_exposure_time = 35

[sla_material:Water-washable @UNIFORMATION]
inherits = *common UNIFORMATION resin*
material_type = Tough
material_colour = #4aa3df
exposure_time = 3.0
initial_exposure_time = 40

[sla_material:Plant-based @UNIFORMATION]
inherits = *common UNIFORMATION resin*
material_type = Plant-Based
material_colour = #6aa84f
exposure_time = 2.5
initial_exposure_time = 30

[sla_material:Tough @UNIFORMATION]
inherits = *common UNIFORMATION resin*
material_type = Tough
material_colour = #c47b2b
exposure_time = 3.2
initial_exposure_time = 40

[sla_material:Flexible @UNIFORMATION]
inherits = *common UNIFORMATION resin*
material_type = Flexible
material_colour = #e6c34a
exposure_time = 4.0
initial_exposure_time = 45

sla_initial_primary_lift_speed = 40
sla_primary_lift_speed = 40

[sla_material:High temperature @UNIFORMATION]
inherits = *common UNIFORMATION resin*
material_type = Heat-resistant
material_colour = #cc3333
exposure_time = 3.5
initial_exposure_time = 40

[sla_material:Clear @UNIFORMATION]
inherits = *common UNIFORMATION resin*
material_type = Tough
material_colour = #d0e8f0
exposure_time = 4.0
initial_exposure_time = 45

[printer:UniFormation GKone]
printer_technology = SLA
printer_model = UNIFORMATION_GKONE
printer_variant = default
default_sla_print_profile = 0.05 Normal @UNIFORMATION
default_sla_material_profile = Standard @UNIFORMATION
thumbnails = 290x290/PNG
sla_archive_format = SL1
sla_output_precision = 0.001
bed_shape = 0x0,221.4x0,221.4x129.6,0x129.6
display_orientation = landscape
display_mirror_x = 0
display_mirror_y = 1
display_pixels_x = 4920
display_pixels_y = 2880
display_width = 221.4
display_height = 129.6
max_print_height = 245
absolute_correction = 0
relative_correction_x = 1
relative_correction_y = 1
relative_correction_z = 1
elefant_foot_compensation = 0.2
elefant_foot_min_width = 0.2
gamma_correction = 1
fast_tilt_time = nil
slow_tilt_time = nil
high_viscosity_tilt_time = nil
min_exposure_time = 0.8
max_exposure_time = 120
min_initial_exposure_time = 0.8
max_initial_exposure_time = 300
printer_notes = Don't remove the following keywords! These keywords are used in the "compatible printer" condition of the print and filament profiles to link the particular print and filament profiles to this printer profile.\nPRINTER_VENDOR_UNIFORMATION\nPRINTER_MODEL_UNIFORMATION_GKONE\nPRINTER_TECHNOLOGY_SLA\nFILEFORMAT_JXS\nEXPORT_SL1\nExport currently writes an .sl1 archive. This printer reads JXS.\n

[printer:UniFormation GKtwo]
printer_technology = SLA
printer_model = UNIFORMATION_GKTWO
printer_variant = default
default_sla_print_profile = 0.05 Normal @UNIFORMATION
default_sla_material_profile = Standard @UNIFORMATION
thumbnails = 290x290/PNG
sla_archive_format = SL1
sla_output_precision = 0.001
bed_shape = 0x0,228.09x0,228.09x128.3,0x128.3
display_orientation = landscape
display_mirror_x = 1
display_mirror_y = 0
display_pixels_x = 7680
display_pixels_y = 4320
display_width = 228.089
display_height = 128.3
max_print_height = 245
absolute_correction = 0
relative_correction_x = 1
relative_correction_y = 1
relative_correction_z = 1
elefant_foot_compensation = 0.2
elefant_foot_min_width = 0.2
gamma_correction = 1
fast_tilt_time = nil
slow_tilt_time = nil
high_viscosity_tilt_time = nil
min_exposure_time = 0.8
max_exposure_time = 120
min_initial_exposure_time = 0.8
max_initial_exposure_time = 300
printer_notes = Don't remove the following keywords! These keywords are used in the "compatible printer" condition of the print and filament profiles to link the particular print and filament profiles to this printer profile.\nPRINTER_VENDOR_UNIFORMATION\nPRINTER_MODEL_UNIFORMATION_GKTWO\nPRINTER_TECHNOLOGY_SLA\nFILEFORMAT_GKTWO.CTB\nEXPORT_SL1\nExport currently writes an .sl1 archive. This printer reads GKTWO.CTB.\n
