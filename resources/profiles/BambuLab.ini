# Bambu Lab FDM printers.
# Bed size and motion limits follow the public machine specifications.
# Start and end gcode use standard motion commands so a sliced file can be printed from the printer's storage.
# AMS and the Bambu network are not used.

[vendor]
name = Bambu Lab
config_version = 1.0.0

[printer_model:X1C]
name = Bambu Lab X1 Carbon
variants = 0.4
technology = FFF
family = X1
default_materials = Sunlu PLA @Sunlu; Sunlu PETG @Sunlu; Sunlu ABS @Sunlu; Sunlu TPU @Sunlu

[printer_model:P1S]
name = Bambu Lab P1S
variants = 0.4
technology = FFF
family = P1
default_materials = Sunlu PLA @Sunlu; Sunlu PETG @Sunlu; Sunlu ABS @Sunlu; Sunlu TPU @Sunlu

[printer_model:P1P]
name = Bambu Lab P1P
variants = 0.4
technology = FFF
family = P1
default_materials = Sunlu PLA @Sunlu; Sunlu PETG @Sunlu; Sunlu ABS @Sunlu; Sunlu TPU @Sunlu

[printer_model:A1]
name = Bambu Lab A1
variants = 0.4
technology = FFF
family = A1
default_materials = Sunlu PLA @Sunlu; Sunlu PETG @Sunlu; Sunlu ABS @Sunlu; Sunlu TPU @Sunlu

[printer_model:A1MINI]
name = Bambu Lab A1 mini
variants = 0.4
technology = FFF
family = A1
default_materials = Sunlu PLA @Sunlu; Sunlu PETG @Sunlu; Sunlu ABS @Sunlu; Sunlu TPU @Sunlu

[print:*common_bambulab*]
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_BAMBU.*/
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = gyroid
external_perimeter_speed = 60
perimeter_speed = 150
infill_speed = 200
solid_infill_speed = 100
travel_speed = 300
first_layer_speed = 50
bridge_speed = 50
support_material_speed = 80
brim_width = 0
skirts = 0

[print:0.20 mm Standard @Bambu Lab]
inherits = *common_bambulab*

[print:0.16 mm Quality @Bambu Lab]
inherits = *common_bambulab*
layer_height = 0.16
first_layer_height = 0.2

[print:0.28 mm Draft @Bambu Lab]
inherits = *common_bambulab*
layer_height = 0.28
first_layer_height = 0.24
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3

[printer:*common_bambulab*]
printer_technology = FFF
printer_vendor = Bambu Lab
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
gcode_flavor = marlin
use_relative_e_distances = 1
silent_mode = 0
remaining_times = 0
variable_layer_height = 1
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.32
retract_length = 0.8
retract_speed = 30
deretract_speed = 30
retract_lift = 0.4
retract_before_travel = 1
wipe = 1
extruder_clearance_height = 40
extruder_clearance_radius = 56
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 20
machine_max_feedrate_e = 30
machine_max_acceleration_x = 10000
machine_max_acceleration_y = 10000
machine_max_acceleration_z = 500
machine_max_acceleration_e = 5000
machine_max_acceleration_extruding = 10000
machine_max_acceleration_retracting = 5000
machine_max_acceleration_travel = 10000
machine_max_jerk_x = 9
machine_max_jerk_y = 9
machine_max_jerk_z = 0.4
machine_max_jerk_e = 5
start_gcode = G90\nM83\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z2 F600\nG1 X25 Y10 F6000\nG1 Z0.25 F600\nG1 X150 E15 F1200\nG92 E0\n
end_gcode = M104 S0\nM140 S0\nM107\nG91\nG1 Z5 F600\nG90\nG1 X10 Y150 F6000\nM84\n

[printer:*common_bambulab_a1*]
inherits = *common_bambulab*
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_acceleration_x = 5000
machine_max_acceleration_y = 5000
machine_max_acceleration_extruding = 5000
machine_max_acceleration_travel = 5000

[printer:*common_bambulab_mini*]
inherits = *common_bambulab_a1*
bed_shape = 0x0,180x0,180x180,0x180
max_print_height = 180
machine_max_acceleration_x = 4000
machine_max_acceleration_y = 4000

[printer:Bambu Lab X1 Carbon]
inherits = *common_bambulab*
printer_model = X1C
printer_variant = 0.4
default_filament_profile = Sunlu PLA @Sunlu
default_print_profile = 0.20 mm Standard @Bambu Lab
printer_notes = Starting profile for a stock Bambu Lab X1 Carbon with a 0.4 mm nozzle. The sliced file is printed from the printer's storage.\nPRINTER_VENDOR_BAMBU\nPRINTER_MODEL_X1C\n

[printer:Bambu Lab P1S]
inherits = *common_bambulab*
printer_model = P1S
printer_variant = 0.4
default_filament_profile = Sunlu PLA @Sunlu
default_print_profile = 0.20 mm Standard @Bambu Lab
printer_notes = Starting profile for a stock Bambu Lab P1S with a 0.4 mm nozzle. The sliced file is printed from the printer's storage.\nPRINTER_VENDOR_BAMBU\nPRINTER_MODEL_P1S\n

[printer:Bambu Lab P1P]
inherits = *common_bambulab*
printer_model = P1P
printer_variant = 0.4
default_filament_profile = Sunlu PLA @Sunlu
default_print_profile = 0.20 mm Standard @Bambu Lab
printer_notes = Starting profile for a stock Bambu Lab P1P with a 0.4 mm nozzle. The sliced file is printed from the printer's storage.\nPRINTER_VENDOR_BAMBU\nPRINTER_MODEL_P1P\n

[printer:Bambu Lab A1]
inherits = *common_bambulab_a1*
printer_model = A1
printer_variant = 0.4
default_filament_profile = Sunlu PLA @Sunlu
default_print_profile = 0.20 mm Standard @Bambu Lab
printer_notes = Starting profile for a stock Bambu Lab A1 with a 0.4 mm nozzle. The sliced file is printed from the printer's storage.\nPRINTER_VENDOR_BAMBU\nPRINTER_MODEL_A1\n

[printer:Bambu Lab A1 mini]
inherits = *common_bambulab_mini*
printer_model = A1MINI
printer_variant = 0.4
default_filament_profile = Sunlu PLA @Sunlu
default_print_profile = 0.20 mm Standard @Bambu Lab
printer_notes = Starting profile for a stock Bambu Lab A1 mini with a 0.4 mm nozzle. The sliced file is printed from the printer's storage.\nPRINTER_VENDOR_BAMBU\nPRINTER_MODEL_A1_MINI\n
