material_type = Plant-Based
material_colour = #6aa84f
exposure_time = 2.5
initial_exposure_time = 30

[sla_material:Tough @ELEGOO]
inherits = *common ELEGOO resin*
material_type = Tough
material_colour = #c47b2b
exposure_time = 3.2
initial_exposure_time = 40

[sla_material:Flexible @ELEGOO]
