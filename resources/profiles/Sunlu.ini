# Sunlu filament and resin starting points.
# Temperatures and exposures are generic 1.75 mm / 0.05 mm mono-LCD values, not a calibrated sheet.

[vendor]
name = Sunlu
config_version = 1.0.0
templates_profile = 1

[filament:*common*]
filament_diameter = 1.75
filament_vendor = Sunlu
extrusion_multiplier = 1
cooling = 1
fan_always_on = 1
filament_cost = 0
filament_density = 1.24
start_filament_gcode = 
end_filament_gcode = 
compatible_printers_condition = printer_technology=="FFF"

[filament:Sunlu PLA]
inherits = *common*
filament_type = PLA
filament_colour = #F4A261
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
fan_below_layer_time = 100
max_fan_speed = 100
min_fan_speed = 100
disable_fan_first_layers = 1

[filament:Sunlu PLA+]
inherits = *common*
filament_type = PLA
filament_colour = #E76F51
temperature = 215
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
fan_below_layer_time = 100
max_fan_speed = 100
min_fan_speed = 80
disable_fan_first_layers = 2

[filament:Sunlu Silk PLA]
inherits = *common*
filament_type = PLA
filament_colour = #C9A227
temperature = 215
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
fan_below_layer_time = 100
max_fan_speed = 100
min_fan_speed = 80
disable_fan_first_layers = 2

[filament:Sunlu PETG]
inherits = *common*
filament_type = PETG
filament_density = 1.27
filament_colour = #2A9D8F
temperature = 240
first_layer_temperature = 245
bed_temperature = 80
first_layer_bed_temperature = 80
fan_below_layer_time = 20
max_fan_speed = 50
min_fan_speed = 30
disable_fan_first_layers = 3

[filament:Sunlu ABS]
inherits = *common*
filament_type = ABS
filament_density = 1.04
filament_colour = #E9C46A
temperature = 255
first_layer_temperature = 255
bed_temperature = 100
first_layer_bed_temperature = 100
cooling = 0
fan_always_on = 0
fan_below_layer_time = 20
max_fan_speed = 30
min_fan_speed = 0
disable_fan_first_layers = 3

[filament:Sunlu ASA]
inherits = *common*
filament_type = ASA
filament_density = 1.07
filament_colour = #F4F1DE
temperature = 260
first_layer_temperature = 260
bed_temperature = 100
first_layer_bed_temperature = 100
cooling = 0
fan_always_on = 0
fan_below_layer_time = 20
max_fan_speed = 30
min_fan_speed = 0
disable_fan_first_layers = 3

[filament:Sunlu TPU]
inherits = *common*
filament_type = TPU
filament_density = 1.21
filament_colour = #6D597A
temperature = 220
first_layer_temperature = 225
bed_temperature = 50
first_layer_bed_temperature = 50
extrusion_multiplier = 1.1
fan_below_layer_time = 20
max_fan_speed = 80
min_fan_speed = 40
disable_fan_first_layers = 3

[sla_material:*common*]
compatible_printers_condition = printer_technology=="SLA"
material_vendor = Sunlu
initial_layer_height = 0.05
exposure_pwm = 255
initial_exposure_pwm = 255
area_fill = 50
material_correction = 1,1,1
sla_initial_primary_lift_distance = 5
sla_initial_primary_lift_speed = 60
sla_initial_secondary_lift_distance = 0
sla_initial_secondary_lift_speed = 60
sla_initial_primary_retract_distance = 5
sla_initial_primary_retract_speed = 150
sla_initial_secondary_retract_distance = 0
sla_initial_secondary_retract_speed = 150
sla_initial_wait_before_lift = 0
sla_initial_wait_after_lift = 0
sla_initial_wait_after_retract = 0.5
sla_primary_lift_distance = 5
sla_primary_lift_speed = 80
sla_secondary_lift_distance = 0
sla_secondary_lift_speed = 80
sla_primary_retract_distance = 5
sla_primary_retract_speed = 150
sla_secondary_retract_distance = 0
sla_secondary_retract_speed = 150
sla_wait_before_lift = 0
sla_wait_after_lift = 0
sla_wait_after_retract = 0.5
material_notes = Starting exposure for 0.05 mm on a mono LCD. Calibrate on the printer before a real part.

[sla_material:Standard @Sunlu]
inherits = *common*
renamed_from = "Sunlu Standard"
material_type = Tough
material_colour = #808080
exposure_time = 2.5
initial_exposure_time = 35

[sla_material:ABS-like @Sunlu]
inherits = *common*
renamed_from = "Sunlu ABS-like"
material_type = Tough
material_colour = #3a3a3a
exposure_time = 2.8
initial_exposure_time = 35

[sla_material:Water-washable @Sunlu]
