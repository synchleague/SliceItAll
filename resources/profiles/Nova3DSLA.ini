variants = default
technology = SLA
family = NOVA3D
default_materials = Standard @NOVA3D; ABS-like @NOVA3D; Water-washable @NOVA3D; Plant-based @NOVA3D; Tough @NOVA3D; Flexible @NOVA3D; High temperature @NOVA3D; Clear @NOVA3D

