# Nova3D SLA printers.
# Bed size and pixel count follow the public UVtools machine list.
# Exposure times are starting points for 0.05 mm on a mono LCD, not a tuned resin sheet.
# Printers marked EXPORT_GOO write a .goo file. Other machines write .sl1 until their own file type is added.

